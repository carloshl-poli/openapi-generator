openapi: 3.0.3
info:
  title: merged spec
  description: merged spec
  version: 1.0.0
servers:
- url: https://api.empresa.com/v1
- url: https://orders.empresa.com
paths:
  /users:
    get:
      summary: List users
      operationId: getUsers
      responses:
        "200":
          description: Successful user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create user from orders portal
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        required: true
      responses:
        "201":
          description: User created
  /orders:
    get:
      summary: List orders
      operationId: getOrders
      responses:
        "200":
          description: Successful order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
components:
  schemas:
    User:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice
    Order:
      required:
      - orderId
      - total
      type: object
      properties:
        orderId:
          type: string
          example: ORD-9912
        total:
          type: number
          format: double
          example: 150.5

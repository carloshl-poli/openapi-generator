openapi: 3.0.3
info:
  title: Users Service
  version: 1.0.0
servers:
  - url: https://api.empresa.com/v1
paths:
  /users:
    get:
      summary: List users
      operationId: getUsers
      responses:
        '200':
          description: Successful user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice


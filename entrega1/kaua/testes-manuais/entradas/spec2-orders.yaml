openapi: 3.0.3
info:
  title: Orders Service
  version: 1.0.0
servers:
  - url: https://api.empresa.com/v1
  - url: https://orders.empresa.com
paths:
  /users:
    post:
      summary: Create user from orders portal
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created
  /orders:
    get:
      summary: List orders
      operationId: getOrders
      responses:
        '200':
          description: Successful order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice
    Order:
      type: object
      required:
        - orderId
        - total
      properties:
        orderId:
          type: string
          example: ORD-9912
        total:
          type: number
          format: double
          example: 150.50

